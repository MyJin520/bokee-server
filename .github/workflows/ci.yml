# 工作流名称
name: Build Docker Image

# 推送到 main、develop 分支时执行，也支持手动触发
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # 构建 Docker 镜像
  build-image-job:
    # 使用 GitHub 提供的 Ubuntu 环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 构建镜像并添加版本标签
      - name: Build Docker image
        run: |
          # 读取 VERSION 文件中的版本号
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$APP_VERSION"

          # 构建镜像，添加版本标签和 latest 标签
          docker build \
            -t "bokee-server:$APP_VERSION" \
            -t "bokee-server:latest" \
            .

      # 3. 导出镜像为 tar 文件
      - name: Export Docker image
        run: |
          docker save -o bokee-server.tar bokee-server:latest
          test -s bokee-server.tar

      # 4. 上传镜像文件，保留 7 天
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bokee-server-image
          path: bokee-server.tar
          retention-days: 7

  # Job 2：在 Windows 自托管 Runner 上上传到 MinIO
  push-minio-job:
    runs-on: [self-hosted, Windows, X64]
    needs: build-image-job

    steps:
      # 1. 下载 Job 1 生成的 tar 文件
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: bokee-server-image
          path: .

      # 2. 检查 Docker 和现有 MinIO 镜像
      - name: Check Docker environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is unavailable"
          }

          $osType = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $osType -ne "linux") {
            throw "Docker must use Linux containers"
          }

          docker image inspect minio/minio:latest
          if ($LASTEXITCODE -ne 0) {
            throw "minio/minio:latest is not available locally"
          }

          if (!(Test-Path "bokee-server.tar") -or
              (Get-Item "bokee-server.tar").Length -eq 0) {
            throw "bokee-server.tar is missing or empty"
          }

          Write-Host "Docker and MinIO image are ready."

      # 3. 使用已有 MinIO 镜像中的 mc 上传文件
      - name: Upload Docker image to MinIO
        shell: pwsh
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:MINIO_ENDPOINT)) {
            throw "MINIO_ENDPOINT is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:MINIO_ACCESS_KEY)) {
            throw "MINIO_ACCESS_KEY is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:MINIO_SECRET_KEY)) {
            throw "MINIO_SECRET_KEY is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:MINIO_BUCKET)) {
            throw "MINIO_BUCKET is missing"
          }

          # 将 Windows 工作目录挂载到 Linux 容器
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')

          docker run --rm `
            --mount "type=bind,source=$workspace,target=/work" `
            -e MINIO_ENDPOINT `
            -e MINIO_ACCESS_KEY `
            -e MINIO_SECRET_KEY `
            -e MINIO_BUCKET `
            --entrypoint /bin/sh `
            minio/minio:latest `
            -c 'set -eu
                mc alias set minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                mc cp /work/bokee-server.tar "minio/$MINIO_BUCKET/bokee-server.tar"
                mc stat "minio/$MINIO_BUCKET/bokee-server.tar"'

          if ($LASTEXITCODE -ne 0) {
            throw "MinIO upload failed"
          }

          Write-Host "MinIO upload completed successfully."