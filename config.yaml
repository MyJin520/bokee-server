# 系统配置
system:
  db-type:                # mysql / postgres
  oss-type:               # 存储类型 local、minio
  addr:                   # 服务地址 localhost:9999
  default-admin-password: # 初始管理员密码（留空则自动生成随机密码，控制台打印）

# 数据库通用配置
db:
  user-name:
  password:
  db-name:
  config:               # MySQL参数/PG参数
  path:                 # ip:端口 localhost:3306
  log-mode: error
  max-idle-conn: 10     # 最大空闲连接
  max-open-conn: 100    # 最大连接数
  conn-max-life-time: 1 # 连接最大生命周期（单位：小时）

# 日志配置
log:
  level: info     # debug/info/warn/error
  format: console # json/console
  output: both    # stdout/file/both
  file-path: ./logs
  max-size: 100   # 单个日志文件最大大小(MB)
  max-backups: 10 # 保留的旧日志文件最大数量
  max-age: 30     # 保留旧日志文件的最大天数
  compress: true  # 是否压缩

# Redis 配置
redis:
  addr:             # 地址（ip:port）
  password:         # 密码（无密码留空）
  db: 0             # 数据库编号（0-15）
  pool-size: 10     # 连接池大小
  min-idle-conns: 5 # 最小空闲连接数
  dial-timeout: 5   # 连接超时（秒）
  read-timeout: 3   # 读取超时（秒）
  write-timeout: 3  # 写入超时（秒）

# JWT 配置
jwt:
  secret:         # 签名密钥
  expire:         # Access Token 有效期 xh(2h)
  refresh-expire: # Refresh Token 有效期 xh(2h)
  issuer:         # 签发者
  audience:       # 受众列表

oss:
  local-oss:
    path:              # 本地文件存储路径

  minio-oss:
    host: ""           # minio服务地址 ip:端口
    access-key-id:     # minio用户名
    access-key-secret: # minio密码
    bucket-name:       # 桶名
    use-ssl:           # 是否使用ssl认证
    file-url:          # minio对外访问地址 http://ip:端口

  ali-oss:
    url: "xxx"