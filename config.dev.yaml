system:
  db-type: mysql
  oss-type: minio
  addr: localhost:8888
  default-admin-password: 123456


db:
  user-name: root
  password: root123456
  db-name: boke-develop
  config: charset=utf8mb4&parseTime=True&loc=Local
  path: localhost:3306
  log-mode: error
  max-idle-conn: 10
  max-open-conn: 100
  conn-max-life-time: 1


log:
  level: info
  format: console
  output: both
  file-path: ./logs
  max-size: 100
  max-backups: 10
  max-age: 30
  compress: true


redis:
  addr: localhost:6379
  password: redis123456
  db: 1
  pool-size: 10
  min-idle-conns: 5
  dial-timeout: 5
  read-timeout: 3
  write-timeout: 3

jwt:
  secret: "kZ9xQ2mF7pL4vN8sR1tY6uI3oP5aD0gH2jK4lM6nB8cV0bX"
  expire: 24h
  issuer: JinYu
  audience:

oss:
  local-oss:
    path:

  minio-oss:
    host: "127.0.0.1:9000"
    access-key-id: minioadmin
    access-key-secret: minioadmin123
    bucket-name: uploads-develop
    use-ssl: false
    file-url: http://127.0.0.1:9000

  ali-oss:
    url: "xxx"


im:
  stranger-quota: 3
  max-content-length: 2000
  send-rate-max: 20
  send-rate-window: 10
  ws-max-conn-per-user: 5
  ws-send-buffer: 128
  ws-ping-interval: 30
  ws-ticket-ttl: 30
  # 允许跨域建立 WebSocket 的前端地址（host 或 host:port）
  # 同源请求无需配置；生产环境请改成实际域名
  ws-origin-patterns:
    - "localhost:5173"
    - "127.0.0.1:5173"
    - "localhost:3000"
    - "127.0.0.1:3000"
