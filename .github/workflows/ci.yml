name: Build and Push Image

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-image-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bokee-server:latest .

      - name: Export image
        run: docker save -o bokee-server.tar bokee-server:latest

      - uses: actions/upload-artifact@v4
        with:
          name: bokee-server-image
          path: bokee-server.tar
          retention-days: 7

  push-minio-job:
    runs-on: ubuntu-latest
    needs: build-image-job
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bokee-server-image
          path: .

      - name: Upload to MinIO
        run: |
          curl -fsSL -o mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x mc
          ./mc alias set minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          ./mc cp bokee-server.tar "minio/$MINIO_BUCKET/server/bokee-server.tar"
