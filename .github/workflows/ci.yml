# 工作流名称
name: Build Docker Image

# 推送到 main 分支时执行，也支持手动触发
on:
  push:
    branches: [ main ,develop ]
  workflow_dispatch:

jobs:
  # 构建 Docker 镜像
  build-image-job:
    # 使用 GitHub 提供的 Ubuntu 环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source code
        uses: actions/checkout

      # 2. 构建镜像并添加版本标签
      - name: Build Docker image
        run: |
          # 读取 VERSION 文件中的版本号
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$APP_VERSION"

          # 构建镜像，添加版本标签和 latest 标签
          docker build \
            -t "bokee-server:$APP_VERSION" \
            -t "bokee-server:latest" \
            .

      # 3. 导出镜像为 tar 文件
      - name: Export Docker image
        run: |
          docker save -o bokee-server.tar bokee-server:latest
          test -s bokee-server.tar

      # 4. 上传镜像文件，保留 7 天
      - name: Upload Docker image artifact
        uses: actions/upload-artifact
        with:
          name: bokee-server-image
          path: bokee-server.tar
          retention-days: 7

  push-minio-job:
    runs-on: ubuntu-latest
    needs: build-image-job

    steps:
      # 从 GitHub Actions 下载上一个 Job 的产物
      - name: Download artifact
        uses: actions/download-artifact
        with:
          name: bokee-server-image

      # 安装minio客户端
      - name: Install Minio Client
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mv /usr/local/bin/mc

      # 链接minio并上传文件
      - name: Upload to MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          # 检查配置是否齐全
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ACCESS_KEY"
          test -n "$MINIO_SECRET_KEY"
          test -n "$MINIO_BUCKET"
          test -s bokee-server.tar
          
          # 配置 MinIO 连接
          mc alias set minio \
            "$MINIO_ENDPOINT" \
            "$MINIO_ACCESS_KEY" \
            "$MINIO_SECRET_KEY"
          
          # 上传到指定 Bucket
          mc cp bokee-server.tar \
            "minio/$MINIO_BUCKET/bokee-server.tar"
          
          # 检查上传结果
          mc stat "minio/$MINIO_BUCKET/bokee-server.tar"