name: Build and Push Image

# 推送到 main / develop 分支时执行，也支持手动触发
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # 构建 Docker 镜像
  build-image-job:
    # 使用 GitHub 提供的 Ubuntu 环境
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      # 1. 拉取仓库代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 构建镜像、打标签并导出 tar 包
      - name: Build Docker image and export tar
        id: build
        run: bash scripts/ci/build-image.sh

      # 3. 上传镜像制品
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bokee-server
          path: bokee-server.tar

  # 推送镜像 tar 包到 MinIO
  push-minio-job:
    runs-on: ubuntu-latest
    # 依赖构建任务，等镜像构建完成后再执行
    needs: build-image-job
    env:
      APP_VERSION: ${{ needs.build-image-job.outputs.version }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
    steps:
      # 1. 下载前面上传的镜像制品
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: bokee-server

      # 2. 下载 mc 客户端，配置 MinIO 并上传文件
      - name: Upload tar image to MinIO
        run: bash scripts/ci/push-minio.sh

  # 推送镜像到 Zot 私有镜像仓库
  push-zot-job:
    runs-on: ubuntu-latest
    # 依赖构建任务，等镜像构建完成后再执行
    needs: build-image-job
    env:
      APP_VERSION: ${{ needs.build-image-job.outputs.version }}
      ZOT_REGISTRY: ${{ secrets.ZOT_REGISTRY }}
      ZOT_USERNAME: ${{ secrets.ZOT_USERNAME }}
      ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
    steps:
      # 1. 下载前面上传的镜像制品
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: bokee-server

      # 2. 配置 insecure registry、加载镜像、登录并推送到 Zot
      - name: Load, login and push image to Zot
        run: bash scripts/ci/push-zot.sh

  # 部署到服务器：按版本号从 Zot 拉取对应镜像并滚动重建 app 容器（不依赖 latest）
  deploy-job:
    name: Deploy to production server
    runs-on: ubuntu-latest
    # 等镜像成功推送到 Zot 后再部署；同时取构建产出的版本号
    needs: [build-image-job, push-zot-job]
    env:
      APP_VERSION: ${{ needs.build-image-job.outputs.version }}
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          # 私钥内容（完整 PEM），对应服务器上已装好的公钥
          key: ${{ secrets.DEPLOY_KEY }}
          # 远程执行：deploy.sh <版本号>，脚本内会校验版本号并拉取对应 tag 重建
          script: /home/kim/server/deploy.sh "${{ env.APP_VERSION }}"
          # 脚本返回非 0 时让任务失败，便于第一时间发现部署异常
          script_stop: true
