name: Release

# 推送到 release 分支时自动发布 GitHub Release；也支持在 Actions 页面手动触发
on:
  push:
    branches: [ release ]
  workflow_dispatch:

# 创建 Release、上传附件需要写仓库内容的权限
permissions:
  contents: write

env:
  APP_NAME: bokee-server
  GO_VERSION: "1.26"

jobs:
  release:
    name: Build binary and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取完整历史，便于生成变更日志
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 读取 VERSION 文件作为 Release 标签（形如 v1.0.5）
      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION" || { echo "VERSION 文件为空" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # 3. 校验版本号语义格式，避免打出非法 tag
      - name: Validate semantic version
        run: |
          case "${{ steps.version.outputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION 必须是 vX.Y.Z 形式（如 v1.0.5）" >&2; exit 1 ;;
          esac

      # 4. 安装 Go 并缓存依赖
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 5. 发布前编译与静态检查，不通过则中止发版
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

      # 6. 交叉编译 linux/amd64 静态二进制（与 Dockerfile 构建参数保持一致）
      - name: Cross-compile linux/amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -tags netgo,osusergo \
            -ldflags="-s -w" \
            -o "dist/${APP_NAME}" .
          # 附带版本号与空白配置模板；config.dev.yaml 含本地密码，不打入产物
          cp VERSION config.yaml dist/

      # 7. 打包 tar.gz 并生成 SHA256 校验和
      - name: Package tarball and checksum
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="${APP_NAME}_${VERSION}_linux_amd64.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" "${APP_NAME}" VERSION config.yaml
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -l dist

      # 8. 若该版本 tag 已存在则跳过，避免重复发布覆盖已有制品
      - name: Check release tag exists
        id: tag-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} 已存在，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 9. 创建 Release 并上传二进制包与校验和；变更日志由 GitHub 根据提交自动生成
      - name: Publish GitHub Release
        if: steps.tag-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
