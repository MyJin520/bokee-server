stages:
  - build-image

build-image-job:
  image: docker:cli
  stage: build-image
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # 可选：让 Go 在构建时把 GOPATH 指向缓存目录
    GOPATH: "$CI_PROJECT_DIR/.go"
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod/  # 缓存 Go 的模块依赖，大幅缩短下载时间
  script:
    - APP_VERSION="$(tr -d '\r\n' < VERSION)"
    - test -n "$APP_VERSION"
    - echo "APP_VERSION = $APP_VERSION"
    - docker info
    - docker build -t "bokee-server:$APP_VERSION" .
    - docker tag "bokee-server:$APP_VERSION" bokee-server:latest
    - docker save -o bokee-server.tar bokee-server:latest
    - test -s bokee-server.tar
  artifacts:
    paths:
      - bokee-server.tar
    expire_in: 7 days
    when: on_success
  tags:
    - docker